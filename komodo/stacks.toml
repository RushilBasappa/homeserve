# ============================================================================
# homeassistant — the home-automation hub (spec-free ADDED app, cf. resume/
# basic-memory). Stateful → ragnaforge-dell (golden rule); ONE volume holds the
# whole instance. THE ONE DELIBERATE CONVENTION BREAK: `network_mode: host`, so
# HA can hear the LAN mDNS/SSDP/DHCP traffic device discovery needs. That means
# NO Traefik LABELS — it is routed by Traefik's FILE provider → 10.0.0.70:8123
# (config `traefik-file-routes` in stacks/traefik/compose.yaml), and it binds
# :8123 on the Dell, LAN/tailnet only, never router-forwarded. A second service
# (homeassistant-init) seeds /config on FIRST boot only (copy-if-absent) so the
# load-bearing reverse-proxy block lives in git. NO secrets (owner account is
# created in the browser at onboarding). NO radio passthrough yet — a Zigbee/
# Z-Wave USB coordinator needs a `devices:` mapping (runbook). Bring-up +
# onboarding + audits in docs/runbooks/homeassistant.md. Manual (webhook_enabled=false).
#
# ⚠ DEPLOY ORDER: the Traefik route ships as an INLINE `configs:` block, and
# editing one needs a container RECREATE (DestroyStack + DeployStack), not a
# plain redeploy — see the runbook.
# ============================================================================
[[stack]]
name = "homeassistant"
description = "homeassistant — home-automation hub (HA Container; host network for mDNS/SSDP discovery; routed via Traefik file provider; LAN/VPN-only)."
tags = ["apps"]

[stack.config]
server = "ragnaforge-dell"
repo = "RushilBasappa/homeserve"
git_provider = "github.com"
branch = "main"
file_paths = ["stacks/homeassistant/compose.yaml"]
webhook_enabled = false

# ============================================================================
# ntfy + changedetection — the alerting pair (spec-free ADDED apps, cf. resume/
# basic-memory/homeassistant). Both stateful → ragnaforge-dell (golden rule).
#
# ntfy is the generic PUSH sink (phone notifications); changedetection is the
# first publisher into it (poll a URL, alert on change — the US visa-slot watch).
# DEPLOY ORDER: ntfy FIRST, run its first-run `ntfy user add` / `ntfy token add`
# steps, then changedetection — its notification URL needs that token.
#
# NO container-referenced secrets in either compose: ntfy's accounts live in its
# own user.db (created by CLI) and changedetection's watch headers + notification
# URL are entered in its UI and stored in the datastore. So nothing is added to
# komodo/bootstrap/periphery.compose.yaml; NTFY_VISA_TOKEN sits in .mise.toml
# purely so the operator/runbook has one place to keep it.
#
# ⚠ The watches are NOT in git (changedetection has no declarative config). The
# datastore volume is the source of truth — back it up, and keep the watch recipe
# in the runbook. Manual deploys (webhook_enabled=false).
#
# Bring-up, ACL setup, the visa-watch recipe and the audits:
# docs/runbooks/alerting.md. ntfy is the PLAN Phase-9 sink landing early — Phase 9's
# Uptime Kuma / Beszel thresholds publish into THIS instance, not a second one.
# ============================================================================
[[stack]]
name = "ntfy"
description = "ntfy — self-hosted push-notification sink (deny-all ACL; reachable from any network on purpose so alerts land on the phone off-LAN)."
tags = ["phase-9", "alerting"]

[stack.config]
server = "ragnaforge-dell"
repo = "RushilBasappa/homeserve"
git_provider = "github.com"
branch = "main"
file_paths = ["stacks/ntfy/compose.yaml"]
webhook_enabled = false

[[stack]]
name = "changedetection"
description = "changedetection.io — URL change watcher (US visa-slot alerts) publishing to ntfy; dashboard LAN/Tailscale only."
