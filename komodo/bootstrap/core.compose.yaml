# Komodo Core — the control plane (Dell only).
#
# Bootstrapped OUT-OF-BAND with `make komodo-core`, because Core *is* the
# orchestrator: it can't be deployed by a Komodo that isn't running yet
# (research R3). Everything ABOVE the control plane — the whoami test stack and
# every later app — is Komodo-managed via ResourceSync, not brought up this way.
#
# Secrets come from the gitignored `.mise.toml` via `mise exec` (the Makefile
# target wraps the compose call) and are referenced as `${VAR}`. Non-secret
# config is inlined below as literals — there is no `core.env` to copy.
#
# Exposure (research R7): Core's UI/API is published on :9120 but the router
# forwards no port to it, so only the LAN (10.0.0.0/24) and Tailscale can reach
# it — never the public internet. Public domain + TLS is Phase 3.

services:
  mongo:
    image: mongo:8
    labels: [komodo.skip]
    command: --quiet --wiredTigerCacheSizeGB 0.5
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DB_PASSWORD}
    volumes:
      - komodo-mongo-data:/data/db
      - komodo-mongo-config:/data/configdb

  core:
    image: ghcr.io/moghtech/komodo-core:2
    init: true
    restart: unless-stopped
    depends_on:
      - mongo
    networks:
      - default
      - traefik
    labels:
      - komodo.skip
      - "traefik.enable=true"
      - "traefik.http.routers.komodo.rule=Host(`komodo.ragnaforge.xyz`)"
      - "traefik.http.routers.komodo.entrypoints=websecure"
      - "traefik.http.routers.komodo.tls=true"
      - "traefik.http.services.komodo.loadbalancer.server.port=9120"
      - "traefik.docker.network=traefik"
    ports:
      - "9120:9120"
    environment:
      KOMODO_HOST: https://komodo.ragnaforge.xyz
      KOMODO_TITLE: Ragnaforge
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_ENABLE_NEW_USERS: "false"
      # Core polls git for new commits at this interval (default 1-hr is too slow
      # for an active repo). Refreshes Core's VIEW only — deploys stay manual.
      KOMODO_RESOURCE_POLL_INTERVAL: 5-min
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_DB_NAME: komodo
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
      KOMODO_PASSKEY: ${KOMODO_PASSKEY}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}

volumes:
  komodo-mongo-data:
    name: komodo-mongo-data
  komodo-mongo-config:
    name: komodo-mongo-config

networks:
  default: {}
  traefik:
    external: true
