# changedetection.io — poll a URL on a schedule, alert only when the content CHANGES.
# Dell-only (stateful: the watch datastore, golden rule).
#
# DRIVING USE CASE: US visa (H-4) appointment-slot alerts, sourced from the SAME JSON
# endpoint the CheckVisaSlots browser extension polls. Nothing is scraped from the
# government site. It is a general watcher though: any URL worth being told about
# becomes another watch.
#
# NO BROWSER SIDECAR — a deliberate, measured decision. The obvious target is the
# public HTML page (checkvisaslots.com/latest-us-visa-availability/h-4-regular/) and it
# LOOKS like it needs a browser, so a `sockpuppetbrowser` sidecar was built, deployed,
# and then REMOVED. What the measurements showed:
#   * That page sits behind Vercel ATTACK CHALLENGE MODE: `HTTP 429` +
#     `x-vercel-mitigated: challenge`. It is a JS proof-of-work interstitial that
#     escalates — once an IP is flagged it stays flagged for many hours.
#   * The browser path did not rescue it: headless Chrome AND headful-under-Xvfb both
#     returned a stripped, unhydrated shell (19 bytes of text), so the filter matched
#     nothing and the watch silently never fired.
#   * ⚠ Worse, the checkpoint page embeds a UNIQUE REQUEST ID per fetch
#     (`sfo1::1785830911-…`). Point a watch at it and every single check "changes" —
#     a permanent false-alert generator.
#   * The API host `app.checkvisaslots.com` is NOT challenge-gated: it answers 200 with
#     clean JSON from the very same Dell IP that the HTML page blocks. That is expected
#     — the extension is itself a non-browser fetch client and cannot solve a JS
#     challenge either.
# Net: watch the API, not the page. No Chrome, no `shm_size: 2gb`, no SYS_ADMIN
# capability on a 7.5 GB node.
#
# ⚠⚠ THE ENDPOINT IS QUOTA-METERED — this drives the poll interval, not politeness.
# Every call decrements `userActivity.remaining` by exactly 1 (measured: 412 → 411 →
# 410) and increments `userActivity.slots`; the two sum to a fixed allowance. The reset
# period is NOT known, so the interval below is deliberately conservative:
#     5 min = 288/day    15 min = 96/day    30 min = 48/day    60 min = 24/day
# The operator's own browser extension draws on the SAME allowance, so the real burn is
# higher than this stack alone. Check the balance any time with a single call:
#   curl -s https://app.checkvisaslots.com/slots/v3 -H "x-api-key: $CHECKVISASLOTS_API_KEY" \
#     -H "origin: chrome-extension://beepaenfejnphdgnkmccjcfiieihhogl" | jq .userActivity
#
# WATCHES LIVE IN THE DATASTORE, NOT IN GIT — the one honest gap versus the rest of the
# fleet. changedetection has no declarative config file; watches, filters, request
# headers and notification URLs are created in the UI and persist in
# changedetection-data. Treat that volume as real state and keep the recipe below.
#
# THE VISA WATCH (configure once in the UI — full walkthrough in the runbook):
#   URL           https://app.checkvisaslots.com/slots/v3
#   Fetcher       Basic fast Plaintext/HTTP Client  (NOT a browser — see above)
#   Headers       x-api-key: <CHECKVISASLOTS_API_KEY>
#                 origin: chrome-extension://beepaenfejnphdgnkmccjcfiieihhogl
#                 extversion: 4.7.3
#                 user-agent: <a normal desktop Chrome UA>
#   Filter        jq:[.slotDetails[] | select(.slots > 0) | "\(.visa_location): \(.slots)"]
#                    | if length == 0 then "none" else join(" | ") end
#   Trigger text  /: [1-9]/
#   Notification  ntfy://<NTFY_VISA_TOKEN>@ntfy/visa
#   Interval      30 minutes  (quota — see above)
#
# ALERT ONLY ON AVAILABILITY — two mechanisms, both load-bearing:
#   * `select(.slots > 0)` means the snapshot lists ONLY locations that actually have
#     slots; with nothing available it collapses to the literal "none". The
#     `if length == 0` guard matters: an EMPTY filter result makes changedetection error
#     with "no filters were found" rather than record a clean empty state.
#   * `trigger_text` = /: [1-9]/ suppresses the notification unless the new snapshot has
#     a non-zero count — otherwise a slot DISAPPEARING ("CHENNAI VAC: 2" -> "none") also
#     pages you, which is noise.
# Verified both ways on deploy: all-zeros sent nothing; a "CHENNAI VAC: 3" snapshot fired.
#
# WHY THAT FILTER — the raw JSON is mostly CHURN. Each slotDetails entry carries a
# `createdon` timestamp and an `imghash` that both change on every poll, and the
# top-level `userActivity.remaining` counts DOWN on every call. Watch the raw body and
# it alerts every cycle forever while meaning nothing. The jq expression reduces the
# whole response to one line of pure signal:
#   "CHENNAI VAC: 0 | HYDERABAD VAC: 0 | KOLKATA VAC: 0 | MUMBAI VAC: 0 | NEW DELHI VAC: 0"
# so "the text changed" reduces to "a location's slot count moved, or a location
# appeared/disappeared" — which is exactly the alert worth waking up for.
#
# The response also carries `userDetails.visa_type` / `appointment_type`: the API key is
# already scoped to the subscriber's visa type, so there is no per-type URL to vary —
# a different visa type means a different key, not a different endpoint.
#
# LAN/TAILNET-ONLY: the dashboard is an unauthenticated request-forwarder by default,
# so it is gated by an ipAllowList (LAN + tailnet), same posture as wud/headplane. The
# ALERTS still reach the phone from anywhere — those go out through ntfy, which is
# deliberately not gated. Set a UI password too (Settings -> General).
#
# IMAGE TAG: pinned (no :latest) per Diun/Renovate intent.
# https://github.com/dgtlmoon/changedetection.io/releases
#
# FULL RUNBOOK (bring-up order, the visa-watch recipe, audits, backups gap):
# docs/runbooks/alerting.md

services:
  changedetection:
    image: dgtlmoon/changedetection.io:0.55.8
    container_name: changedetection
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      # External URL — baked into notification bodies so the alert links back here.
      BASE_URL: https://changedetection.ragnaforge.xyz
      # Honour Traefik's X-Forwarded-* headers (correct scheme/host behind the proxy).
      USE_X_SETTINGS: "1"
      # Don't leak this instance's URL as a Referer to the sites being watched.
      HIDE_REFERER: "true"
      # Concurrent fetch workers — a handful of watches needs nothing exotic.
      FETCH_WORKERS: "10"
    volumes:
      # Watches, history snapshots, notification URLs — real state.
      - changedetection-data:/datastore
    networks:
      # Same network as ntfy, so notifications go to http://ntfy:80 internally.
      - traefik
    healthcheck:
      # ⚠ python3, NOT wget/curl — this image ships NEITHER. A healthcheck that
      # references a missing binary fails forever, Docker marks the container
      # `unhealthy`, and TRAEFIK'S DOCKER PROVIDER SILENTLY SKIPS UNHEALTHY
      # CONTAINERS — so the vhost 404s (no router) instead of 502-ing. That failure
      # mode reads exactly like a DNS/TLS/Cloudflare problem and is not: verify with
      # `docker inspect <c> --format '{{json .State.Health}}'` before blaming the edge.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      # changedetection.ragnaforge.xyz — LAN/tailnet only. Listens on :5000.
      - "traefik.enable=true"
      - "traefik.http.routers.changedetection.rule=Host(`changedetection.ragnaforge.xyz`)"
      - "traefik.http.routers.changedetection.entrypoints=websecure"
      - "traefik.http.routers.changedetection.tls=true"
      - "traefik.http.routers.changedetection.middlewares=changedetection-lan"
      - "traefik.http.middlewares.changedetection-lan.ipallowlist.sourcerange=10.0.0.0/24,100.64.0.0/10,127.0.0.1/32"
      - "traefik.http.services.changedetection.loadbalancer.server.port=5000"

volumes:
  # Local named volume on the Dell (golden rule: state → the Dell).
  changedetection-data:

networks:
  # Shared external proxy network — no host ports.
  traefik:
    external: true
