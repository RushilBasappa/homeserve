# changedetection.io — poll a URL on a schedule, alert only when the content CHANGES.
# Dell-only (stateful: the watch datastore, golden rule).
#
# DRIVING USE CASE: US visa (H-4) appointment-slot alerts off the PUBLIC page
# https://checkvisaslots.com/latest-us-visa-availability/h-4-regular/ — no account, no
# extension API key, nothing scraped from the government site. It is a general watcher
# though: any URL worth being told about becomes another watch.
#
# NO BROWSER SIDECAR — and that is a deliberate, measured decision, not an omission.
# The page LOOKS like it needs one (Next.js on Vercel behind a bot challenge), and a
# `sockpuppetbrowser` sidecar was built, deployed and then REMOVED after measurement:
#   * From a laptop/workstation IP a plain fetch gets HTTP 429 + `x-vercel-mitigated:
#     challenge` — the "Vercel Security Checkpoint" interstitial. That is what makes
#     the browser look mandatory.
#   * From the DELL, changedetection's plain `html_requests` fetcher gets the REAL
#     page, ~10 KB of text with the full availability table in it. The table is
#     server-rendered, so no JS execution is needed at all.
#   * The browser path was strictly WORSE: headless Chrome (and headful under Xvfb)
#     received a stripped, unhydrated shell — 19 bytes of text — so the filter matched
#     nothing and the watch silently never fired.
# Net: the plain fetcher is the one that works here, and it costs no Chrome, no
# `shm_size: 2gb`, no SYS_ADMIN capability on a 7.5 GB node. If the Dell's IP ever
# starts getting challenged, revisit — but measure before adding a browser back.
#
# ⚠ THE SITE RATE-LIMITS: rapid rechecks earn `HTTP error code 429 (Access denied or
# blocked)`. At the 5-minute interval below this is not hit; hammering the recheck
# button is what triggers it. changedetection keeps the last good snapshot and retries
# on the next cycle, so an occasional 429 is self-healing — do not "fix" it by adding
# retries or a browser.
#
# WATCHES LIVE IN THE DATASTORE, NOT IN GIT — the one honest gap versus the rest of the
# fleet. changedetection has no declarative config file; watches, filters and
# notification URLs are created in the UI and persist in changedetection-data. Treat
# that volume as real state and keep the recipe below written down.
#
# THE VISA WATCH (configure once in the UI — full walkthrough in the runbook):
#   URL           https://checkvisaslots.com/latest-us-visa-availability/h-4-regular/
#   Fetcher       Basic fast Plaintext/HTTP Client  (NOT a browser — see above)
#   Filter        td:nth-child(-n+5)
#   Trigger       "Send notification when filter text CHANGES"
#   Notification  ntfy://<NTFY_VISA_TOKEN>@ntfy/visa
#   Interval      5 minutes
#
# WHY THAT FILTER — the page has exactly ONE table, 7 columns:
#   1 Visa Location · 2 Visa Type · 3 Earliest Date · 4 Slots on Earliest Date
#   5 Total Dates Available · 6 Last Seen At · 7 Relative Time
# Columns 6-7 are CHURN: "29 mins ago" re-renders on every single load, and the page
# also stamps "The current info is generated at <now>". Watch the raw page and it
# alerts every 5 minutes forever while meaning nothing. `td:nth-child(-n+5)` keeps only
# columns 1-5, so "the text changed" reduces to "a location's earliest date or slot
# count actually moved" — which is the alert you want. Dropping column 6 also means no
# alert when the SAME availability is merely re-confirmed.
#
# LAN/TAILNET-ONLY: the dashboard is an unauthenticated request-forwarder by default,
# so it is gated by an ipAllowList (LAN + tailnet), same posture as wud/headplane. The
# ALERTS still reach the phone from anywhere — those go out through ntfy, which is
# deliberately not gated. Set a UI password too (Settings -> General).
#
# IMAGE TAG: pinned (no :latest) per Diun/Renovate intent.
# https://github.com/dgtlmoon/changedetection.io/releases
#
# FULL RUNBOOK (bring-up order, the visa-watch recipe, audits, backups gap):
# docs/runbooks/alerting.md

services:
  changedetection:
    image: dgtlmoon/changedetection.io:0.55.8
    container_name: changedetection
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      # External URL — baked into notification bodies so the alert links back here.
      BASE_URL: https://changedetection.ragnaforge.xyz
      # Honour Traefik's X-Forwarded-* headers (correct scheme/host behind the proxy).
      USE_X_SETTINGS: "1"
      # Don't leak this instance's URL as a Referer to the sites being watched.
      HIDE_REFERER: "true"
      # Concurrent fetch workers — a handful of watches needs nothing exotic.
      FETCH_WORKERS: "10"
    volumes:
      # Watches, history snapshots, notification URLs — real state.
      - changedetection-data:/datastore
    networks:
      # Same network as ntfy, so notifications go to http://ntfy:80 internally.
      - traefik
    healthcheck:
      # ⚠ python3, NOT wget/curl — this image ships NEITHER. A healthcheck that
      # references a missing binary fails forever, Docker marks the container
      # `unhealthy`, and TRAEFIK'S DOCKER PROVIDER SILENTLY SKIPS UNHEALTHY
      # CONTAINERS — so the vhost 404s (no router) instead of 502-ing. That failure
      # mode reads exactly like a DNS/TLS/Cloudflare problem and is not: verify with
      # `docker inspect <c> --format '{{json .State.Health}}'` before blaming the edge.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      # changedetection.ragnaforge.xyz — LAN/tailnet only. Listens on :5000.
      - "traefik.enable=true"
      - "traefik.http.routers.changedetection.rule=Host(`changedetection.ragnaforge.xyz`)"
      - "traefik.http.routers.changedetection.entrypoints=websecure"
      - "traefik.http.routers.changedetection.tls=true"
      - "traefik.http.routers.changedetection.middlewares=changedetection-lan"
      - "traefik.http.middlewares.changedetection-lan.ipallowlist.sourcerange=10.0.0.0/24,100.64.0.0/10,127.0.0.1/32"
      - "traefik.http.services.changedetection.loadbalancer.server.port=5000"

volumes:
  # Local named volume on the Dell (golden rule: state → the Dell).
  changedetection-data:

networks:
  # Shared external proxy network — no host ports.
  traefik:
    external: true
